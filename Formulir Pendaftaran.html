<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>index.html</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      form {
        max-width: 400px;
      }
      div {
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      input[type="text"],
      input[type="email"],
      input[type="password"] {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
      }
      button {
        padding: 10px 20px;
        background: #4caf50;
        color: white;
        border: none;
        cursor: pointer;
      }
      button:hover {
        background: #45a049;
      }
    </style>
  </head>
  <body>
    <h2>Formulir Pendaftaran</h2>

    <form action="https://formsubmit.co/haikaljpr1@gmail.com" method="post">
      <div>
        <label for="nama">Nama Lengkap:</label>
        <input type="text" id="nama" name="nama" required />
      </div>

      <div>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />
      </div>

      <div>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required />
      </div>

      <div>
        <label>Jenis Kelamin:</label>
        <input type="radio" id="pria" name="jeniskelamin" value="Pria" />
        <label for="pria" style="display: inline">Pria</label>

        <input type="radio" id="wanita" name="jeniskelamin" value="Wanita" />
        <label for="wanita" style="display: inline">Wanita</label>
      </div>

      <div>
        <input type="checkbox" id="setuju" name="setuju" required />
        <label for="setuju" style="display: inline"
          >Saya setuju dengan syarat & ketentuan</label
        >
      </div>

      <div>
        <button type="submit">Daftar</button>
      </div>
    </form>
  </body>
</html>
